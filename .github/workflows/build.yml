
name: Build PixelVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.java'
      - '**.kt'
      - '**.xml'
      - '**.gradle'
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build PixelVault Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Gradle project
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::File settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          elif [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Gradle wrapper and root Gradle build file not found."
            exit 1
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVault-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

