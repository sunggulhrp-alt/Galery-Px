name: Build Galery Px APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Galery Px Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository root."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p project-src
          unzip -oq "$ZIP_FILE" -d project-src

          PROJECT_DIR="$(find "$PWD/project-src" \
            -type f \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings not found inside ZIP."
            find project-src -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" \
            assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galery-Px-debug-apk
          path: project-src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
