name: Build Galery Px APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Galery Px Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract Android project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="$PWD"
          else
            ZIP="$(find . -maxdepth 1 -type f \
              -iname '*.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "::error::No project ZIP or Gradle settings found."
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            PROJECT="$(find "$PWD/extracted" -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \) \
              -printf '%h\n' | head -n 1)"

            if [ -z "$PROJECT" ]; then
              echo "::error::Gradle settings not found inside ZIP."
              exit 1
            fi
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Fix SecretKeySpec import
        shell: bash
        run: |
          FILE="$PROJECT/app/src/main/java/id/pixelsoft/pixelvault/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "::error::MainActivity.java not found: $FILE"
            exit 1
          fi

          sed -i \
            's/import javax\.crypto\.SecretKeySpec;/import javax.crypto.spec.SecretKeySpec;/' \
            "$FILE"

          if grep -q \
            'import javax.crypto.SecretKeySpec;' "$FILE"; then
            echo "::error::SecretKeySpec import is still incorrect."
            exit 1
          fi

          grep -n 'SecretKeySpec' "$FILE"

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT" assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galery-Px-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
