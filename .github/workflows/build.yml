name: Build Galery Px APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Galery Px Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="$PWD"
          else
            ZIP="$PWD/Galery-Px-project-fixed-v3.zip"

            if [ ! -f "$ZIP" ]; then
              echo "::error::Project ZIP not found: $ZIP"
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            PROJECT="$(find "$PWD/extracted" -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \) \
              -printf '%h\n' | head -n 1)"

            if [ -z "$PROJECT" ]; then
              echo "::error::Gradle settings not found in ZIP"
              exit 1
            fi
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::App Gradle file not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Fix Java source issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          project = Path(os.environ.get("PROJECT", ""))
          source = project / "app/src/main/java/id/pixelsoft/pixelvault/MainActivity.java"

          if not source.is_file():
              raise SystemExit(f"MainActivity.java not found: {source}")

          text = source.read_text()

          text = text.replace(
              "import javax.crypto.SecretKeySpec;",
              "import javax.crypto.spec.SecretKeySpec;"
          )

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if "item.addView(button(installed?" in line:
                  if "installedForAction" not in line:
                      indent = re.match(r"\s*", line).group(0)
                      lines.insert(
                          i,
                          indent + "final boolean installedForAction = installed;"
                      )
                      lines[i + 1] = re.sub(
                          r"\binstalled\b",
                          "installedForAction",
                          lines[i + 1]
                      )
                  break

          source.write_text("\n".join(lines) + "\n")
          print("Java source checks completed.")
          PY

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$PROJECT" assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galery-Px-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
