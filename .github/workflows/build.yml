
name: Build Galery Px APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.java'
      - '**.kt'
      - '**.xml'
      - '**.gradle'
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Galery Px Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android project files
        run: |
          echo "Checking repository structure..."

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file is missing."
            echo "The Android project source code must be uploaded."
            echo "Expected: settings.gradle or settings.gradle.kts"
            exit 1
          fi

          if [ ! -f gradlew ] && \
             [ ! -f build.gradle ] && \
             [ ! -f build.gradle.kts ]; then
            echo "::error::Gradle build files are missing."
            exit 1
          fi

          echo "Project configuration found."

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Galery Px APK
        uses: actions/upload-artifact@v4
        with:
          name: Galery-Px-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
